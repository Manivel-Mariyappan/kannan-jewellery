<form [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="row g-3">
    <div class="col-xl-6">
      <admin-card heading="Shop" subtitle="Name and tagline" icon="◆">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="s-name">
              Shop name
              <span class="text-danger">*</span>
            </label>
            <input
              id="s-name"
              placeholder="Enter shop name"
              class="form-control"
              formControlName="shopName"
              [class.is-invalid]="invalid('shopName')"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="s-tag">Tagline</label>
            <input
              id="s-tag"
              placeholder="Enter tagline"
              class="form-control"
              formControlName="tagline"
            />
          </div>
        </div>
      </admin-card>

      <admin-card
        heading="Contact"
        subtitle="Used for WhatsApp enquiries and call buttons"
        icon="✆"
      >
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="s-wa">WhatsApp number</label>
            <input
              id="s-wa"
              class="form-control"
              type="text"
              formControlName="whatsappNumber"
              appNumbersOnly
              [decimals]="0"
              [class.is-invalid]="invalid('whatsappNumber')"
              placeholder="Enter WhatsApp number with country code"
            />
            <div class="form-text">Digits only, with country code (91 for India).</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="s-phone">Phone</label>
            <input
              id="s-phone"
              class="form-control"
              formControlName="phone"
              placeholder="Enter phone number"
            />
          </div>
          <div class="col-12">
            <label class="form-label" for="s-email">Email</label>
            <input
              id="s-email"
              placeholder="Enter email address"
              class="form-control"
              type="email"
              formControlName="email"
              [class.is-invalid]="invalid('email')"
            />
          </div>
        </div>
      </admin-card>

      <admin-card heading="Certification" subtitle="Shown on the home and about pages" icon="✓">
        <textarea
          id="s-cert"
          placeholder="Enter certification details, e.g. BIS hallmark registration number"
          class="form-control"
          rows="2"
          formControlName="certification"
          aria-label="Certification statement"
        ></textarea>
        <div card-footer>
          Only enter verified information, e.g. your hallmarking registration. Leave empty to hide.
        </div>
      </admin-card>
    </div>

    <div class="col-xl-6">
      <admin-card heading="Address" subtitle="Shown in the footer, contact page and map" icon="⌖">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="s-a1">
              Address line 1
              <span class="text-danger">*</span>
            </label>
            <input
              id="s-a1"
              placeholder="Enter door number and street"
              class="form-control"
              formControlName="addressLine1"
              [class.is-invalid]="invalid('addressLine1')"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="s-a2">Address line 2</label>
            <input
              id="s-a2"
              placeholder="Enter landmark (optional)"
              class="form-control"
              formControlName="addressLine2"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label" for="s-city">City / town</label>
            <input
              id="s-city"
              placeholder="Enter city or town"
              class="form-control"
              formControlName="city"
            />
          </div>
          <div class="col-md-5">
            <label class="form-label" for="s-state">State</label>
            <ng-select
              labelForId="s-state"
              formControlName="state"
              [items]="states"
              placeholder="Select state"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label" for="s-pin">PIN code</label>
            <input
              id="s-pin"
              placeholder="Enter PIN code"
              class="form-control"
              type="text"
              maxlength="6"
              formControlName="postalCode"
              appNumbersOnly
              [decimals]="0"
            />
          </div>
          <div class="col-12">
            <label class="form-label" for="s-map">Google Maps search text</label>
            <input
              id="s-map"
              placeholder="Enter text to search on Google Maps"
              class="form-control"
              formControlName="mapsQuery"
            />
          </div>
          <div class="col-12">
            <label class="form-label" for="s-dir">Directions to the showroom</label>
            <textarea
              id="s-dir"
              class="form-control"
              rows="2"
              formControlName="directions"
              placeholder="Enter directions, e.g. opposite the bus stand"
            ></textarea>
          </div>
        </div>
      </admin-card>

      <admin-card heading="Opening hours" icon="◷">
        <button
          card-actions
          type="button"
          class="btn btn-sm btn-outline-primary"
          (click)="addHours()"
        >
          + Add row
        </button>
        <div formArrayName="openingHours" class="vstack gap-2">
          @for (row of form.controls.openingHours.controls; track row; let i = $index) {
            <div [formGroupName]="i" class="input-group">
              <input
                class="form-control"
                formControlName="days"
                placeholder="Enter days, e.g. Monday to Saturday"
                aria-label="Days"
              />
              <input
                class="form-control"
                formControlName="hours"
                placeholder="Enter hours, e.g. 10:00 AM to 8:30 PM"
                aria-label="Hours"
              />
              <button
                type="button"
                class="btn btn-outline-danger"
                (click)="removeHours(i)"
                aria-label="Remove row"
              >
                ✕
              </button>
            </div>
          } @empty {
            <p class="text-body-secondary mb-0">No opening hours added.</p>
          }
        </div>
      </admin-card>
    </div>
  </div>

  <div class="d-flex flex-wrap gap-2">
    <button type="submit" class="btn btn-primary">Update settings</button>
    <button type="button" class="btn btn-outline-secondary" (click)="download()">
      Download settings.json
    </button>
  </div>
</form>
