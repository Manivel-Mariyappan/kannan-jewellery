<admin-ui-only-note api="/api/enquiries" />

<div class="d-flex flex-wrap gap-2 mb-3" role="group" aria-label="Filter by status">
  <button
    type="button"
    class="btn btn-sm"
    [class]="status() ? 'btn-outline-secondary' : 'btn-dark'"
    (click)="status.set(null)"
  >
    All
    <span class="badge text-bg-light ms-1">{{ data.enquiries.all().length }}</span>
  </button>
  @for (s of statuses; track s) {
    <button
      type="button"
      class="btn btn-sm"
      [class]="status() === s ? 'btn-dark' : 'btn-outline-secondary'"
      (click)="status.set(s)"
    >
      {{ s }}
      <span class="badge text-bg-light ms-1">{{ counts()[s] }}</span>
    </button>
  }
</div>

<div class="card border-0 shadow-sm">
  <div class="card-header bg-white d-flex flex-wrap align-items-center gap-2 py-3">
    <input
      type="search"
      class="form-control form-control-sm"
      style="max-width: 320px"
      placeholder="Search customer, mobile, product…"
      (input)="search.set($any($event.target).value)"
    />
    <button type="button" class="btn btn-sm btn-primary ms-auto" (click)="open(null)">
      + Add enquiry
    </button>
  </div>
  <ag-grid-angular
    style="display: block; height: calc(100vh - 320px); min-height: 360px"
    [theme]="theme"
    [rowData]="rows()"
    [columnDefs]="columns"
    [defaultColDef]="{
      sortable: true,
      filter: true,
      resizable: true,
      suppressHeaderMenuButton: true,
    }"
    [getRowId]="getRowId"
    [quickFilterText]="search()"
    [rowHeight]="52"
    [pagination]="true"
    [paginationPageSize]="20"
  />
</div>
