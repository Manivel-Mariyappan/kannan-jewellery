<div class="offcanvas-header border-bottom bg-white">
  <h2 class="offcanvas-title h5 mb-0" id="category-form-title">
    {{ category ? 'Edit category' : 'Add category' }}
  </h2>
  <button type="button" class="btn-close" aria-label="Close" (click)="offcanvas.dismiss()"></button>
</div>

<form
  class="offcanvas-body bg-body-tertiary"
  [formGroup]="form"
  (ngSubmit)="save()"
  id="category-form"
  novalidate
>
  <admin-card heading="Category details" subtitle="Name and web address" icon="◆" [required]="true">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="c-name">
          Category name
          <span class="text-danger">*</span>
        </label>
        <input
          id="c-name"
          class="form-control"
          formControlName="name"
          [class.is-invalid]="invalid('name')"
          placeholder="Enter category name"
        />
        <div class="invalid-feedback">Category name is required.</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="c-slug">
          URL slug
          <span class="text-danger">*</span>
        </label>
        <input
          id="c-slug"
          placeholder="Auto-filled from the category name"
          class="form-control"
          formControlName="slug"
          [class.is-invalid]="invalid('slug')"
        />
        <div class="form-text">/collections/{{ form.controls.slug.value || '…' }}</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="c-parent">Parent category</label>
        <ng-select
          labelForId="c-parent"
          formControlName="parentId"
          [items]="parents()"
          bindLabel="name"
          bindValue="id"
          placeholder="Select parent category (optional)"
        />
      </div>
      <div class="col-md-6">
        <label class="form-label" for="c-order">Display order</label>
        <input
          id="c-order"
          placeholder="Enter display order"
          class="form-control"
          type="text"
          formControlName="displayOrder"
          appNumbersOnly
          [decimals]="0"
        />
      </div>
      <div class="col-12">
        <label class="form-label" for="c-desc">Description</label>
        <textarea
          id="c-desc"
          placeholder="Enter a short description"
          class="form-control"
          rows="3"
          formControlName="description"
        ></textarea>
      </div>
    </div>
  </admin-card>

  <admin-card
    heading="Category image"
    subtitle="Shown in the category menu and on the home page"
    icon="▣"
  >
    <label card-actions class="btn btn-sm btn-primary mb-0">
      Upload image
      <input
        #file
        type="file"
        accept="image/jpeg,image/png,image/webp"
        hidden
        (change)="upload(file)"
      />
    </label>
    <div class="d-flex align-items-center gap-3">
      @if (image()) {
        <img
          [src]="assetUrl(image())"
          alt=""
          class="rounded-3 border"
          width="96"
          height="96"
          style="object-fit: cover"
        />
      } @else {
        <div
          class="rounded-3 border border-dashed d-grid text-body-secondary small"
          style="width: 96px; height: 96px; place-items: center"
        >
          No image
        </div>
      }
      <input
        class="form-control"
        placeholder="Or enter an image path, e.g. images/necklaces.webp"
        [value]="image().startsWith('data:') ? '' : image()"
        (change)="image.set($any($event.target).value.trim())"
      />
    </div>
  </admin-card>

  <admin-card heading="Visibility" icon="◉">
    <div class="vstack gap-2">
      <div class="form-check form-switch">
        <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="c-active"
          formControlName="active"
        />
        <label class="form-check-label" for="c-active">Active</label>
      </div>
      <div class="form-check form-switch">
        <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="c-menu"
          formControlName="showInMenu"
        />
        <label class="form-check-label" for="c-menu">Show in website menu</label>
      </div>
    </div>
  </admin-card>

  <admin-card heading="SEO" subtitle="Search engine title and description" icon="⌕">
    <div class="mb-3">
      <label class="form-label" for="c-mt">Meta title</label>
      <input
        id="c-mt"
        placeholder="Enter page title for search engines"
        class="form-control"
        formControlName="metaTitle"
        maxlength="70"
      />
      <div class="form-text">{{ form.controls.metaTitle.value.length }}/70</div>
    </div>
    <div>
      <label class="form-label" for="c-md">Meta description</label>
      <textarea
        id="c-md"
        placeholder="Enter page description for search engines"
        class="form-control"
        rows="2"
        formControlName="metaDescription"
        maxlength="160"
      ></textarea>
      <div class="form-text">{{ form.controls.metaDescription.value.length }}/160</div>
    </div>
  </admin-card>
</form>

<div class="border-top bg-white p-3 d-flex justify-content-end gap-2">
  <button type="button" class="btn btn-outline-secondary" (click)="offcanvas.dismiss()">
    Cancel
  </button>
  <button type="submit" form="category-form" class="btn btn-primary px-4">
    {{ category ? 'Update category' : 'Add category' }}
  </button>
</div>
